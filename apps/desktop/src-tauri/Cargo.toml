[package]
name = "iconcore-desktop"
version = "1.3.1"
description = "IconCore desktop shell"
authors = ["IconCore"]
license = "MIT"
repository = "https://github.com/mafhper/icon-core"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
