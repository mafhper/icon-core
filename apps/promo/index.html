    <!--
      No Google Fonts. Manrope (body), Sora (display) and IBM Plex Mono (mono) are declared
      by `@font-face` in `src/index.css` and served from `src/fonts/`, vendored from
      `assets/fonts/` and checked by `scripts/check-brand.mjs`. A CDN link here would undo
      the offline-first promise: without a network the faces vanish and the page reflows
      into the fallback metrics.
    -->
    <!-- Same reasoning as apps/web/index.html: the generated icons, the OG images and
         the web app manifest are gone and come back with the IC61F build path. -->
  </head>

  </body>
