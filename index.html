<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICON FORGE - Professional Asset Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* --- DESIGN SYSTEM TOKENS --- */
        
        /* Base Backgrounds */
        --bg-primary: #000000;
        --bg-secondary: #09090b; /* zinc-950 */
        --bg-tertiary: #18181b;  /* zinc-900 */
        
        /* Glass / Borders */
        --border-subtle: rgba(255, 255, 255, 0.05);
        --border-light: rgba(255, 255, 255, 0.1);
        --bg-glass: rgba(24, 24, 27, 0.6); /* zinc-900 with opacity */

        /* Text */
        --text-primary: #ffffff;
        --text-secondary: #a1a1aa; /* zinc-400 */
        --text-muted: #71717a;     /* zinc-500 */
        --text-subtle: #52525b;    /* zinc-600 */

        /* Accents (Purple/Pink Primary) */
        --accent-from: #a855f7; /* purple-500 */
        --accent-to: #ec4899;   /* pink-500 */
      }

      [data-theme="light"] {
        /* Light Mode Mapping (Inverted for visibility while keeping structure) */
        --bg-primary: #ffffff;
        --bg-secondary: #f4f4f5; /* zinc-100 */
        --bg-tertiary: #e4e4e7;  /* zinc-200 */
        
        --border-subtle: rgba(0, 0, 0, 0.05);
        --border-light: rgba(0, 0, 0, 0.1);
        --bg-glass: rgba(255, 255, 255, 0.8);

        --text-primary: #09090b;
        --text-secondary: #52525b;
        --text-muted: #71717a;
        --text-subtle: #a1a1aa;

        --accent-from: #3b82f6; /* blue-500 */
        --accent-to: #a855f7;   /* purple-500 */
      }

      [data-theme="design"] {
        /* Design / Blueprint Mode - Technical Look */
        --bg-primary: #0f172a;   /* slate-900 */
        --bg-secondary: #1e293b; /* slate-800 */
        --bg-tertiary: #334155;  /* slate-700 */
        
        /* Cyan/Technical Borders */
        --border-subtle: rgba(34, 211, 238, 0.15); /* cyan-400 low opacity */
        --border-light: rgba(34, 211, 238, 0.3);
        --bg-glass: rgba(15, 23, 42, 0.9);

        /* High Contrast Text */
        --text-primary: #f0f9ff; /* sky-50 */
        --text-secondary: #bae6fd; /* sky-200 */
        --text-muted: #7dd3fc;     /* sky-300 */
        --text-subtle: #0ea5e9;    /* sky-500 */

        --accent-from: #06b6d4; /* cyan-500 */
        --accent-to: #3b82f6;   /* blue-500 */
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: 'Inter', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        transition: background-color 0.3s, color 0.3s;
      }

      /* Grid Pattern for Design Mode */
      [data-theme="design"] body {
        background-image: 
          linear-gradient(rgba(34, 211, 238, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      
      input, textarea, .selectable-text {
        user-select: text;
        -webkit-user-select: text;
      }

      /* Drag Regions for Electron/Desktop */
      .titlebar-drag-region {
        -webkit-app-region: drag;
        app-region: drag;
      }
      .no-drag {
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--text-subtle); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted); 
      }

      /* Utility for hiding scrollbar but allowing scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- HIGH PERFORMANCE CSS ANIMATIONS --- */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes slideInLeft {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }

      /* Utility classes for animations */
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; /* Start hidden */
      }

      .animate-zoom-in {
        animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-slide-in-left {
        animation: slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Mapping Tailwind utilities to our CSS Variables
              bg: {
                primary: 'var(--bg-primary)',
                secondary: 'var(--bg-secondary)',
                tertiary: 'var(--bg-tertiary)',
                glass: 'var(--bg-glass)',
              },
              border: {
                subtle: 'var(--border-subtle)',
                light: 'var(--border-light)',
              },
              text: {
                primary: 'var(--text-primary)',
                secondary: 'var(--text-secondary)',
                muted: 'var(--text-muted)',
                subtle: 'var(--text-subtle)',
              },
              zinc: {
                950: '#09090b',
                900: '#18181b',
                800: '#27272a',
                700: '#3f3f46',
                600: '#52525b',
                500: '#71717a',
                400: '#a1a1aa',
                300: '#d4d4d8',
                200: '#e4e4e7',
                100: '#f4f4f5',
                50: '#fafafa',
              }
            },
            backgroundImage: {
              'gradient-primary': 'linear-gradient(to bottom right, var(--accent-from), var(--accent-to))',
              'gradient-text': 'linear-gradient(to right, #c084fc, #f472b6, #60a5fa)', 
              'gradient-glow': 'radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15), transparent 70%)',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "jszip": "https://aistudiocdn.com/jszip@^3.10.1",

    "file-saver": "https://aistudiocdn.com/file-saver@^2.0.5"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
