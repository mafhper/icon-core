<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ICON FORGE - Professional Asset Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default Dark (Obsidian) */
        --bg-primary: #000000;
        --bg-secondary: #0a0a0a;
        --bg-card: #141414;
        --border: rgba(255, 255, 255, 0.08);
        --text-main: #ffffff;
        --text-sub: #a1a1aa;
        --accent: #a855f7;
        --accent-glow: rgba(168, 85, 247, 0.4);
        --glass: rgba(10, 10, 10, 0.7);
        --grid-opacity: 0.03;
      }

      [data-theme="light"] {
        /* Premium Light (Quartz) */
        --bg-primary: #f5f5f7;
        --bg-secondary: #ffffff;
        --bg-card: #ffffff;
        --border: rgba(0, 0, 0, 0.06);
        --text-main: #1d1d1f;
        --text-sub: #86868b;
        --accent: #0071e3;
        --accent-glow: rgba(0, 113, 227, 0.2);
        --glass: rgba(255, 255, 255, 0.8);
        --grid-opacity: 0.02;
      }

      [data-theme="tender"] {
        /* Studio Blueprint */
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-card: #1e293b;
        --border: rgba(56, 189, 248, 0.2);
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent: #fbbf24;
        --accent-glow: rgba(251, 191, 36, 0.3);
        --glass: rgba(15, 23, 42, 0.9);
        --grid-opacity: 0.1;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-main);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Desktop only scroll locking to keep panels independent */
      @media (min-width: 768px) {
        body { overflow: hidden; height: 100vh; height: 100dvh; }
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .blueprint-grid {
        background-image: radial-gradient(var(--accent) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: var(--grid-opacity);
      }

      /* Native scroll on mobile, custom/hidden on desktop */
      @media (min-width: 768px) {
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      }
      
      @keyframes springIn {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .animate-spring {
        animation: springIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      button:active { transform: scale(0.96); }
      button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              studio: {
                bg: 'var(--bg-primary)',
                sec: 'var(--bg-secondary)',
                card: 'var(--bg-card)',
                border: 'var(--border)',
                text: 'var(--text-main)',
                sub: 'var(--text-sub)',
                accent: 'var(--accent)',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "jszip": "https://aistudiocdn.com/jszip@^3.10.1",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
        "file-saver": "https://aistudiocdn.com/file-saver@^2.0.5"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
