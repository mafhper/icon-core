version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 10

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:15"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    # init e analyze precisam andar juntos: o CodeQL recusa quando um esta em
    # 4.38.0 e o outro em 4.38.2 ("configuration file for version X, but running
    # version Y"). Sem o grupo o Dependabot abre um PR por linha de `uses:` e
    # cada um sozinho reprova o check Analyze.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
