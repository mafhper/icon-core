# When a release/vX.Y.Z bump PR is merged, tags main as vX.Y.Z and triggers the
# desktop release (a tag pushed via GITHUB_TOKEN would not fire workflows by itself).
name: release-tag

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-tag-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag and trigger release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_HEAD_REF#release/v}"
          git config --global --add http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:$GITHUB_TOKEN" | base64)"
          if git tag -l "v${VERSION}" | grep -q .; then
            echo "tag v${VERSION} already exists; skipping"
            exit 1
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          echo "pushed tag v${VERSION}"
          gh workflow run release-desktop.yml -f tag="v${VERSION}"