name: Dependabot auto-merge

# Habilita auto-merge apenas para bumps patch do Dependabot.
# Minor e major (semver-minor / semver-major) ficam de fora de propósito — exigem revisão humana.
#
# Autenticação: o merge usa um token de GitHub App (APP_ID + APP_PRIVATE_KEY nos
# Dependabot secrets) em vez do GITHUB_TOKEN. Motivo: merges feitos com o
# GITHUB_TOKEN não disparam outros workflows no push para a `main` (proteção de
# recursão do GitHub), deixando CodeQL e Deploy Pages sem rodar no commit novo.
# Sem as credenciais do App, o workflow cai para o GITHUB_TOKEN e emite um aviso.
#
# Segurança: usamos `pull_request` (não `pull_request_target`) porque o job não
# faz checkout nem executa código do PR, e o guard limita a execução a PRs do
# Dependabot neste repositório.
#
# Método de merge: o histórico de `main` usa merge commits (allow_merge_commit),
# portanto `gh pr merge --merge`. (O release-bump, para PRs de release, usa squash.)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge (patch)
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'mafhper/icon-core'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve credentials (GitHub App, com fallback)
        id: creds
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Credenciais do GitHub App ausentes::APP_ID e/ou APP_PRIVATE_KEY não estão nos Dependabot secrets. O merge usará GITHUB_TOKEN e NÃO disparará os workflows de push."
          fi

      - name: Create GitHub App token
        id: app-token
        if: steps.creds.outputs.has_app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mafhper
          repositories: icon-core
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for patch updates
        if: steps.creds.outputs.has_app != ''
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}