# Desktop installers + GitHub Release are created only when a version tag is pushed
# (e.g. the release-bump workflow, or `git tag -a v1.3.1 -m "Release v1.3.1" && git push origin v1.3.1`).
# Pushes to main update GitHub Pages but do not create a new Release.
name: release-desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Build release body
        id: build-body
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          body_file="$RUNNER_TEMP/release-body.md"
          {
            if [ -f "public/releases/release-feed-${version}.png" ]; then
              printf '%s\n' '<p align="center">'
              printf '%s\n' "  <img src=\"https://raw.githubusercontent.com/mafhper/icon-core/${RELEASE_TAG}/public/releases/release-feed-${version}.png\" alt=\"IconCore ${version}\" width=\"960\">"
              printf '%s\n' '</p>'
              printf '%s\n' ''
            fi
            printf '%s\n' 'IconCore é um editor de ícones: importe imagens, ajuste cores e exporte em múltiplos formatos, inclusive icon fonts.'
            if [ -f "$notes_file" ]; then
              printf '%s\n' ''
              printf '%s\n' '## O que tem de novo nesta versão'
              cat "$notes_file"
            fi
            printf '%s\n' ''
            printf '%s\n' '## Instalação'
            printf '%s\n' ''
            printf '%s\n' '| Sistema | Arquivo recomendado | Uso |'
            printf '%s\n' '| --- | --- | --- |'
            printf '%s\n' '| Windows | `IconCore_*_x64-setup.exe` | Instalação comum, sem exigir privilégios de administrador |'
            printf '%s\n' '| Windows | `IconCore_*_x64.msi` | Ambientes gerenciados |'
            printf '%s\n' '| Linux | `iconcore_*_amd64.deb` | Ubuntu, Debian e derivados |'
            printf '%s\n' '| macOS | `IconCore_*_aarch64.dmg` | Macs com Apple Silicon |'
            printf '%s\n' ''
            printf '%s\n' '<details>'
            printf '%s\n' '<summary>Outros detalhes de instalação</summary>'
            printf '%s\n' ''
            printf '%s\n' '- O instalador EXE é a opção recomendada para a maioria das pessoas no Windows.'
            printf '%s\n' '- O MSI atende ambientes gerenciados; no macOS, arraste o IconCore para a pasta Aplicativos.'
            printf '%s\n' '- No Linux, além do DEB também há AppImage e arquivos compactados entre os arquivos da versão.'
            printf '%s\n' ''
            printf '%s\n' '</details>'
            printf '%s\n' ''
            printf '%s\n' '---'
          } > "$body_file"
          generated="$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$RELEASE_TAG" -f target_commitish="main" --jq '.body' 2>/dev/null || true)"
          if [ -n "$generated" ]; then
            {
              printf '%s\n' ''
              printf '%s\n' '<details>'
              printf '%s\n' '<summary>Lista de mudanças (gerada automaticamente)</summary>'
              printf '%s\n' ''
              printf '%s\n' "$generated"
              printf '%s\n' ''
              printf '%s\n' '</details>'
            } >> "$body_file"
          fi

      - name: Resolve or create the release
        id: create-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if id="$(gh release view "$RELEASE_TAG" --json id --jq '.id' 2>/dev/null)"; then
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release create "$RELEASE_TAG" --target main --title "IconCore $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-body.md" >/dev/null 2>&1 || true
            sleep 5
          done
          echo "could not resolve or create release $RELEASE_TAG" >&2
          exit 1

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "IconCore v__VERSION__"
          releaseId: ${{ steps.create-release.outputs.release_id }}
          releaseDraft: false
          prerelease: false