name: release-desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.release_tag }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(node -e "const fs=require('fs');const raw=fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8');const data=JSON.parse(raw);process.stdout.write(data.version)")
            TAG="v${VERSION}"
          fi

          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput("exists", "true");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
              } else {
                throw error;
              }
            }

      - name: Decide whether release build should run
        id: decide
        shell: bash
        run: |
          SHOULD="false"
          EVENT="${{ github.event_name }}"
          EXISTS="${{ steps.check-release.outputs.exists }}"

          if [ "$EVENT" = "release" ] || [ "$EVENT" = "workflow_dispatch" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SHOULD="true"
          elif [ "$EVENT" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ] && [ "$EXISTS" = "false" ]; then
            SHOULD="true"
          fi

          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: IconCore ${{ env.RELEASE_TAG }}
          releaseBody: |
            Automated desktop release for IconCore ${{ env.RELEASE_TAG }}.
            Direct download links are finalized after all platform bundles are uploaded.
          releaseDraft: false
          prerelease: false

  update-release-notes:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Build release body with platform links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          release = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/releases/tags/{tag}"], text=True))
          assets = release.get("assets", [])

          def is_signature(name: str) -> bool:
              lower = name.lower()
              return (
                  lower.endswith(".sig")
                  or lower.endswith(".sigstore")
                  or lower.endswith(".sha256")
                  or lower.endswith(".sha256sum")
                  or lower.endswith(".json")
              )

          def pick(extensions, hints):
              usable = [asset for asset in assets if not is_signature(asset["name"])]
              for extension in extensions:
                  for asset in usable:
                      if asset["name"].lower().endswith(extension):
                          return f"[{asset['name']}]({asset['browser_download_url']})"
              for hint in hints:
                  for asset in usable:
                      if hint in asset["name"].lower():
                          return f"[{asset['name']}]({asset['browser_download_url']})"
              return "Not available in this release."

          windows = pick([".msi", ".exe"], ["windows", "win64", "win32"])
          macos = pick([".dmg", ".pkg", ".app.tar.gz"], ["macos", "darwin", "mac"])
          linux = pick([".appimage", ".deb", ".rpm", ".tar.xz", ".tar.gz"], ["linux"])

          body = "\n".join(
              [
                  f"Desktop release for **{tag}**.",
                  "",
                  "## Downloads",
                  f"- Windows: {windows}",
                  f"- macOS: {macos}",
                  f"- Linux: {linux}",
                  "",
                  "## All assets",
                  f"- [Open release page]({release['html_url']})",
              ]
          )

          with open("release-body.md", "w", encoding="utf-8") as file:
              file.write(body)
          PY

      - name: Update release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: gh release edit "$TAG" --repo "$REPO" --title "IconCore $TAG" --notes-file release-body.md
