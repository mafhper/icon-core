name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Third-party asset guard
        run: node scripts/check-third-party-assets.mjs

      - name: Brand guard (one source, derived copies)
        run: node scripts/check-brand.mjs

      - name: UI boundary guard (G6)
        run: node scripts/check-ui-boundary.mjs

      - name: UI budget guard (G1 + ratchets)
        run: node scripts/check-ui-budget.mjs

      - name: UI contrast guard
        run: node scripts/check-ui-contrast.mjs

      # Ja houve tres copias do download do projeto (Topbar, Ctrl+S, CommandPalette),
      # cada uma carregando o dirty indevido e o revoke no mesmo tick. Duas e uma
      # decisao; tres e um sintoma.
      - name: Project download guard
        run: node scripts/check-project-download.mjs

      # Sete arquivos carregam a versao do release. Se um ficar para tras, nada acusa:
      # o `npm ci` passa (a versao do lockfile e metadado, nao contrato), o build passa
      # e a suite passa. Aconteceu em 2026-10-06 — o package-lock.json dizia 1.6.0
      # depois do bump para 1.7.0 (IC-N44).
      - name: Version sync guard
        run: node scripts/check-version-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build workspace
        run: npm run build

      # The CLI's bin had never been executed by CI, which is why a build that
      # could not load stayed green. `dist` exists by this point.
      - name: CLI smoke (the built bin must run)
        run: node scripts/cli-smoke.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Renders the same projects through the canvas compositor and through the
      # SVG export, and compares them pixel by pixel. This caught the SVG export
      # dropping blendMode and drawing a squircle as a rounded rect — neither of
      # which any other gate could see.
      - name: SVG/canvas parity
        run: node scripts/check-svg-parity.mjs

      # Two gates that were previously versioned but never wired here, so they only ever
      # ran on one machine — and on that machine they were measuring the *launcher's*
      # failure rather than the mutation. A gate that no CI runs is not a gate.
      #
      #   escape-xml mutation: 5 real defects injected one at a time into the source; the
      #     spec must fail on each. Verifies the coverage exists, not just the tests.
      #   add-layer payload types: `tsc` must reject the wrong action payload and accept
      #     the right one. A runtime test cannot check this, because the protection IS
      #     the compiler (ADR-021).
      - name: escapeXml mutation gate
        run: node scripts/check-escape-xml-mutation.mjs

      - name: ADD_LAYER payload type gate
        run: node scripts/check-add-layer-payload-types.mjs

      # A regra que o dono fixou ao pedir o preset Android: "se o Android não lê o SVG,
      # não faz sentido exportar o formato para esse preset" — generalizada para todo preset.
      # Um artefato em formato que nenhuma plataforma do preset lê é inútil, e falha no
      # build da pessoa, não no export.
      - name: Preset format coherence
        run: node scripts/check-preset-format-coherence.mjs

      - name: End-to-end tests
        run: npm run test:e2e

      # Enforces the visual contract: gallery captures plus the inspector layout
      # assertions (no horizontal overflow at 240/288/320/380). Reuses the
      # workspace build from the step above.
      - name: UI shots + inspector layout contract
        run: npm run ui:shots

  desktop-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Install dependencies
        run: npm ci

      - name: Build desktop (debug)
        run: npm run desktop:smoke

      # O build acima regenera `gen/schemas/` a partir do ACL do tauri **compilado**.
      # Aqueles três JSON são rastreados, e nada comparava os dois até agora (IC-N45):
      # um bump de tauri que mude o ACL deixa os schemas descrevendo a versão antiga
      # enquanto o binário aceita os comandos da nova. Aconteceu no PR #231 — o tauri
      # 2.12.1 acrescentou `core:app:exit` e `core:window:set_fullscreen_on_monitor`,
      # e os PRs do Dependabot não podiam trazer a regeneração porque ele não builda.
      # O custo aqui é zero: este job já paga o build de Rust.
      - name: Schemas do Tauri em dia
        shell: bash
        run: |
          sujo="$(git status --porcelain -- apps/desktop/src-tauri/gen/schemas/)"
          if [ -n "$sujo" ]; then
            echo "::error::gen/schemas/ mudou depois do build. Rode 'npm run desktop:smoke' e commite os schemas regerados junto com o bump do tauri."
            printf '%s\n' "$sujo"
            git diff -- apps/desktop/src-tauri/gen/schemas/
            exit 1
          fi
          echo "gen/schemas/ em dia com o tauri compilado."

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
