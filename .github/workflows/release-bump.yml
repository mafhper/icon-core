# Bumps the version across the workspace, prepares the per-version release notes
# and opens a PR so the bump can be reviewed before it lands on main.
# Merging a pull request from a release/vX.Y.Z branch triggers release-tag.yml,
# which tags vX.Y.Z and publishes the desktop release via release-desktop.yml.
name: release-bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version without the v prefix (e.g. 1.3.1)'
        required: true
        type: string
      notes:
        description: 'Optional release notes (Markdown). Leave blank to keep .github/release-notes/vX.Y.Z.md or create a placeholder.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid version: $VERSION"; exit 1 ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create release branch
        run: git checkout -b "release/v${VERSION}"

      - name: Bump version files
        run: bun scripts/release-bump.mjs "$VERSION"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/v${VERSION}.md"
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            printf '%s\n' '${{ github.event.inputs.notes }}' > "$notes_file"
          elif [ ! -f "$notes_file" ]; then
            {
              printf '%s\n' '- _Descreva aqui as novidades desta versão antes de publicar._'
              printf '%s\n' ''
            } > "$notes_file"
          else
            echo "keeping existing $notes_file"
          fi

      - name: Commit, push branch and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:$GITHUB_TOKEN" | base64)"
          git add -A
          git commit -m "chore(release): bump version to v${VERSION}" --allow-empty
          git push -u origin "release/v${VERSION}"
          PR_URL="$(gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "chore(release): bump version to v${VERSION}" \
            --body "Bumps the version to v${VERSION} and prepares the per-version release notes. Merging this PR tags v${VERSION} and publishes the desktop release." \
            --json url --jq .url)"
          echo "opened $PR_URL"
          if gh pr merge "$PR_URL" --auto --squash --delete-branch >/dev/null 2>&1; then
            echo "auto-merge enabled; the release will follow once the PR merges."
          else
            echo "auto-merge not enabled; merge the PR to publish the release."
          fi